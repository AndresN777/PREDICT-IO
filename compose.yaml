services:
  backend:
    build: ./backend
    environment:
      PARQUET_PATH: /data/matches.parquet
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
